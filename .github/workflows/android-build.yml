name: Android build

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''
      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Bootstrap wrapper JAR
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin
      - name: Commit generated Gradle wrapper JAR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "Gradle wrapper JAR is already committed."
          else
            git commit -m "build: commit Gradle 8.13 wrapper JAR"
            git push origin "HEAD:$HEAD_REF"
          fi
      - name: Upload Gradle 8.13 wrapper JAR
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.13
          path: gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: error
          retention-days: 7
      - name: Lint, test and assemble
        run: |
          chmod +x ./gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zyra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_SIGNED_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''
      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Bootstrap wrapper JAR
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zyra-release.keystore"
      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/zyra-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
